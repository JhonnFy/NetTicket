services:
  mysql:
    container_name: mysql
    image: mysql:latest
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    environment:
      TZ: America/Bogota
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_USER: AdminQa
      MYSQL_PASSWORD: MoesDeveloper0312809833
      MYSQL_DATABASE: ticketsdbqa
    volumes:
      - ./dB:/docker-entrypoint-initdb.d/
      - ticketsdbqaVolumen:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 200s
      
  app:
    container_name: netticket
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - TZ=America/Bogota
      - APP_NAME=Docker-NetTicket-QA
      - ConnectionStrings__MySqlConnection=Server=mysql;Database=ticketsdbqa;User=AdminQa;Password=MoesDeveloper0312809833;CharSet=utf8mb4;
      
volumes:
  ticketsdbqaVolumen: